<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auth0 connection Rewriter</title>
  <style>
    body { font: 14px sans-serif; margin: 24px; max-width: 480px; }
    label, input, button { display: block; }
    input { box-sizing: border-box; margin: 8px 0 12px; padding: 8px; width: 100%; }
  </style>
</head>
<body>
  <h1>Auth0 connection Rewriter</h1>
  <label for="connection">Replacement connection value</label>
  <input id="connection" type="text" placeholder="Leave blank to disable">
  <button id="save">Save</button>
  <p id="status" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
